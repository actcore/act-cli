name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  build-pypi:
    uses: ./.github/workflows/build-pypi.yml

  build-npm:
    needs: build
    uses: ./.github/workflows/build-npm.yml

  sbom:
    uses: ./.github/workflows/build-sbom.yml

  attest:
    name: Attest ${{ matrix.crate }}
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - crate: act-cli
            artifact-pattern: "act-!(build-*)"
          - crate: act-build
            artifact-pattern: "act-build-*"
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ${{ matrix.artifact-pattern }}
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "artifacts/*"
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: "artifacts/*"
          sbom-path: "sbom/${{ matrix.crate }}/${{ matrix.crate }}.cdx.json"

  pypi-publish:
    name: Publish to PyPI
    needs: [build, build-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Attest PyPI artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  npm-publish:
    name: Publish to npm
    needs: build-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: packed
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish all packages with provenance
        run: |
          # Platform packages first (no cross-deps), then wrappers last
          for tgz in packed/*.tgz; do
            case "$(basename "$tgz")" in
              actcore-act-cli-*|actcore-act-build-[a-z]*) npm publish "./$tgz" --provenance --access public || true ;;
            esac
          done
          for tgz in packed/*.tgz; do
            case "$(basename "$tgz")" in
              actcore-act-cli-*|actcore-act-build-[a-z]*) ;; # already published
              *) npm publish "./$tgz" --provenance --access public || true ;;
            esac
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates-publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: wkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: wkg wit fetch --type wit
        working-directory: act-cli
        env:
          WKG_CONFIG_FILE: wkg-registry.toml
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        # Resilient workspace publish. `cargo publish --workspace` is fragile in
        # two ways we keep hitting: (1) it aborts on the first member whose
        # version already exists (so a partial/retry can never finish), and
        # (2) it can time out waiting for a just-published dependency to become
        # resolvable on the crates.io index (the publish race). This loop fixes
        # both: it auto-discovers publishable members (publish = false excluded,
        # so adding a crate needs no workflow change), publishes each, treats
        # "already exists" as success (idempotent re-runs), and retries members
        # that aren't ready yet across rounds until the index catches up.
        run: |
          members=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          remaining="$members"
          for round in $(seq 1 10); do
            still=""
            for c in $remaining; do
              if out=$(cargo publish -p "$c" --allow-dirty 2>&1); then
                echo "✓ published $c"
              elif printf '%s' "$out" | grep -qiE 'already (exists|uploaded)'; then
                echo "• $c already on crates.io"
              else
                echo "· $c not ready (round $round): $(printf '%s' "$out" | tail -1)"
                still="$still $c"
              fi
            done
            remaining=$(echo $still | xargs)
            [ -z "$remaining" ] && { echo "all crates published"; break; }
            echo "waiting for index before retrying:$remaining"
            sleep 20
          done
          if [ -n "$remaining" ]; then echo "::error::failed to publish:$remaining"; exit 1; fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  docker-publish:
    needs: build
    uses: ./.github/workflows/build-docker.yml
    with:
      push: true
    secrets: inherit

  release:
    name: GitHub Release
    needs: [attest, pypi-publish, npm-publish, crates-publish, docker-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{act,act-build}-*"
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]"{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No release notes found for $VERSION in CHANGELOG.md" >&2
            exit 1
          fi
          cat /tmp/notes.md
      - name: Create or update GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" artifacts/* sbom/*/*.cdx.json --clobber
          else
            gh release create "${{ github.ref_name }}" \
              artifacts/* sbom/*/*.cdx.json \
              --title "${{ github.ref_name }}" \
              --notes-file /tmp/notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
