name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          components: clippy
          bins: wkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: wkg wit fetch --type wit
        working-directory: crates/act-runtime
        env:
          WKG_CONFIG_FILE: wkg-registry.toml
      # `-D clippy::all -D warnings` is the gate: correctness lints and every
      # rustc warning block a merge. `pedantic` is deliberately exempt — it is
      # enabled at `warn` in `Cargo.toml` so its suggestions are visible on
      # every build without any one of them being able to stop a release. See
      # the comment on `[workspace.lints.clippy]` for why.
      - run: cargo clippy -- -D clippy::all -D warnings -A clippy::pedantic

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          components: rustfmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt -- --check

  test:
    name: Test
    needs: [check, fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: wkg, cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: wkg wit fetch --type wit
        working-directory: crates/act-runtime
        env:
          WKG_CONFIG_FILE: wkg-registry.toml
      - run: cargo nextest run

  build:
    needs: [check, fmt]
    uses: ./.github/workflows/build.yml

  build-pypi:
    needs: [check, fmt]
    uses: ./.github/workflows/build-pypi.yml

  build-npm:
    needs: build
    uses: ./.github/workflows/build-npm.yml

  build-docker:
    needs: build
    uses: ./.github/workflows/build-docker.yml
    with:
      push: false

  build-sbom:
    needs: [check, fmt]
    uses: ./.github/workflows/build-sbom.yml

  supply-chain:
    uses: ./.github/workflows/supply-chain.yml
