name: Build

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            dest: macos-aarch64
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            dest: macos-x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            dest: windows-x86_64.exe
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: .exe
            dest: windows-aarch64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          targets: ${{ matrix.target }}
          bins: wkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: wkg wit fetch --type wit
        working-directory: crates/act-runtime
        env:
          WKG_CONFIG_FILE: wkg-registry.toml
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binaries
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/act${{ matrix.ext }} act-${{ matrix.dest }}
          cp target/${{ matrix.target }}/release/act-build${{ matrix.ext }} act-build-${{ matrix.dest }}
      - uses: actions/upload-artifact@v7
        with:
          name: act-${{ matrix.dest }}
          path: act-${{ matrix.dest }}
      - uses: actions/upload-artifact@v7
        with:
          name: act-build-${{ matrix.dest }}
          path: act-build-${{ matrix.dest }}

  zigbuild:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # `zig_target` carries the glibc floor and `target` does not, because
          # the two are read by different things: rustup and the artifact path
          # want the bare triple, only `cargo zigbuild` understands the suffix.
          #
          # 2.34 is where glibc began exporting `res_query`, which
          # `hclient-dns-system` calls for SVCB/HTTPS records. Below it the
          # link fails outright; the underscored `__res_query` that older
          # headers `#define` to is not an escape, since a modern glibc keeps
          # it only as a compat symbol new code cannot bind to. An unsuffixed
          # gnu triple is not neutral here — zig picks a default well under
          # 2.34, which is how these three came to fail while musl passed.
          - name: linux-x86_64-gnu
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.34
          - name: linux-aarch64-gnu
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.34
          - name: linux-riscv64-gnu
            target: riscv64gc-unknown-linux-gnu
            zig_target: riscv64gc-unknown-linux-gnu.2.34
          - name: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
          - name: linux-riscv64-musl
            target: riscv64gc-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          targets: ${{ matrix.target }}
          bins: wkg, cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: mlugg/setup-zig@v2
      - run: wkg wit fetch --type wit
        working-directory: crates/act-runtime
        env:
          WKG_CONFIG_FILE: wkg-registry.toml
      - run: cargo zigbuild --release --target ${{ matrix.zig_target || matrix.target }}
      # The glibc floor is a documented product requirement (README, "Runtime
      # requirement: glibc 2.34"), so it is asserted rather than assumed. A
      # build setting alone would let the floor drift upward silently — one
      # dependency calling a newer symbol is all it takes, and the failure
      # would surface as a user's "GLIBC_2.38 not found" months later.
      #
      # Both directions are errors. Higher than 2.34 breaks the promise;
      # missing `res_query` means the SVCB path was dropped, which is the
      # feature the floor is paid for, and a floor bought for nothing should
      # be spent rather than kept.
      - name: the glibc floor is exactly what the README promises
        if: endsWith(matrix.name, '-gnu')
        run: |
          set -euo pipefail
          for bin in target/${{ matrix.target }}/release/act \
                     target/${{ matrix.target }}/release/act-build; do
            highest=$(objdump -T "$bin" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
            echo "$bin requires at most $highest"
            if [ "$highest" != "GLIBC_2.34" ]; then
              echo "::error::$bin requires $highest, but the README promises \
          glibc 2.34. Raising the floor is a breaking change: update the README \
          and this check together, or find the dependency that raised it."
              exit 1
            fi
          done
          if ! objdump -T target/${{ matrix.target }}/release/act \
               | grep -q 'res_query'; then
            echo "::error::act no longer references res_query, so the 2.34 \
          floor buys nothing. If SVCB/HTTPS lookups were dropped on purpose, \
          lower the floor and the README with it."
            exit 1
          fi
      - name: Rename binaries
        run: |
          cp target/${{ matrix.target }}/release/act act-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/act-build act-build-${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: act-${{ matrix.name }}
          path: act-${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: act-build-${{ matrix.name }}
          path: act-build-${{ matrix.name }}
