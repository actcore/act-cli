[package]
name = "act-build"
version.workspace = true
edition.workspace = true
description = "Build tool for ACT WASM components"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["act", "wasm", "component-model", "build"]
categories = ["command-line-utilities", "wasm", "development-tools::build-utils"]

readme.workspace = true

[[bin]]
name = "act-build"
path = "src/main.rs"

[dependencies]
act-types.workspace = true
anyhow = "1"
base64 = "0.22"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
ciborium = "0.2"
dirs = "6"
json-patch = "4"
oci-client = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmparser.workspace = true
wasm-encoder = "0.247.0"
minijinja = "2"
walkdir = "2"
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"
