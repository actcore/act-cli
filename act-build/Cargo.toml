[package]
name = "act-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build tool for ACT WASM components"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["act", "wasm", "component-model", "build"]
categories = ["command-line-utilities", "wasm", "development-tools::build-utils"]

readme.workspace = true

[[bin]]
name = "act-build"
path = "src/main.rs"

[dependencies]
act-types.workspace = true
anyhow.workspace = true
base64.workspace = true
globset.workspace = true
clap.workspace = true
# `oci-client::Client::push_manifest_raw` takes an `http::HeaderValue` for the
# manifest content-type; same `http` 1.x oci-client itself uses.
http.workspace = true
ciborium.workspace = true
dirs.workspace = true
json-patch = "4"
oci-client.workspace = true
# Canonical-JSON formatter — must match what `oci-client` uses to serialize
# manifests on push, so our computed digest equals the registry's stored one.
olpc-cjson = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
flate2 = "1"
hclient.workspace = true
hclient-native.workspace = true
hclient-rt-tokio.workspace = true
hclient-tls-rustls.workspace = true
hclient-dns-system.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "fs", "io-util"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasmparser.workspace = true
wasm-encoder = "0.257.1"
minijinja = "2"
walkdir = "2"
include_dir = "0.7"

[dev-dependencies]
tempfile.workspace = true
