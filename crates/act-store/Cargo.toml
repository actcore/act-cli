[package]
name = "act-store"
description = "Local OCI-layout component store for ACT (act-cli, act-toolserver)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["act", "wasm", "oci", "component", "store"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
fs4 = { version = "1", features = ["sync"] }
oci-spec = "0.10.0"
dirs.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "fs", "io-util"] }
oci-client.workspace = true
hclient.workspace = true
hclient-native.workspace = true
hclient-rt-tokio.workspace = true
hclient-tls-rustls.workspace = true
hclient-dns-system.workspace = true
# Named directly only to choose the process-level crypto provider — see
# `fetch::install_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
url.workspace = true
regex.workspace = true
tracing.workspace = true
futures = "0.3"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
wiremock = "0.6"
flate2 = "1"
