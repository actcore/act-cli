[workspace]
members = ["act-cli", "act-build", "crates/act-credentials", "crates/act-store", "crates/act-policy", "crates/act-policy-wasm", "crates/act-runtime"]
resolver = "3"

[workspace.package]
version = "0.11.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/actcore/act-cli"
homepage = "https://actcore.dev"
readme = "README.md"

[workspace.dependencies]
act-types = "0.14"
wasmparser = "0.252.0"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream", "http2", "gzip", "brotli", "zstd"] }
# Shared across two or more workspace members.
anyhow = "1.0.102"
base64 = "0.22.1"
# CSPRNG for the OAuth flow's PKCE verifier, `state`, and one-time callback
# path. `getrandom` rather than `rand`: these want OS entropy directly, not a
# seeded PRNG, and 0.3 is already in the tree.
getrandom = "0.3"
webbrowser = { version = "1.2", features = ["hardened"] }
ciborium = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6"
globset = "0.4"
http = "1"
oci-client = "0.17"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = "1.52"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
# Dev-only, shared.
tempfile = "3"

[profile.release]
lto = "thin"
