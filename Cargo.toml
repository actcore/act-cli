[workspace]
members = ["act-cli", "act-build", "crates/act-store"]
resolver = "3"

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/actcore/act-cli"
homepage = "https://actcore.dev"
readme = "README.md"

[workspace.dependencies]
act-types = "0.9"
wasmparser = "0.250.0"

[profile.release]
lto = "thin"
