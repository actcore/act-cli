[workspace]
members = ["act-cli", "act-build", "crates/act-credentials", "crates/act-store", "crates/act-policy", "crates/act-policy-wasm", "crates/act-runtime", "crates/act-mcp"]
resolver = "3"

[workspace.package]
version = "0.13.1"
edition = "2024"
# The floor we support, not the toolchain we build with (`rust-toolchain.toml`
# tracks stable). Raise it only when something we depend on forces it, and say
# so in the commit: for a consumer this is a breaking change.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/actcore/act-cli"
homepage = "https://actcore.dev"
readme = "README.md"

# `pedantic` as a group, with three of its members turned back off.
#
# The group is worth having: most of what it catches here was a real
# idiom — a `match` that wanted `if let`, a closure that wanted the method,
# a `format!` that wanted an inline argument. Those are fixed rather than
# silenced.
#
# The three below are style requirements about *documentation*, not about
# code, and they accounted for 165 of the 393 warnings the group first
# reported. Turning them on would mean writing an `# Errors` section for
# every `Result`-returning function in the workspace — including private
# helpers whose error is one line above the signature — and a `#[must_use]`
# on every getter. That is a large diff whose reviewers learn nothing, and
# a rule people satisfy with boilerplate rather than thought.
#
# `missing_errors_doc` in particular is aimed at library crates whose
# callers cannot read the source. Ours can: the two published libraries
# document their error types on the types themselves.
# **`pedantic` warns; it does not gate.**
#
# `cargo clippy -- -D warnings` runs in the pre-commit hook and in CI, and
# that gate is for defects. Turning 67 style suggestions into commit-blocking
# errors would mean every one of them has to be resolved before anything else
# can land — and they are suggestions about how existing, working, reviewed
# code is written, not about whether it is correct.
#
# So the group is `warn`: visible on every build, actionable, and something a
# reviewer can point at, without holding the release hostage to a large
# stylistic diff. What `--fix` could do safely has been applied (188 sites,
# 747 tests unchanged); the rest changes function signatures across eight
# crates and belongs in its own commit, not smuggled into an infrastructure
# change.
#
# The `allow`ed members below are opted out for stated reasons, not because
# they were noisy.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
# Length is an architecture question, not a lint one. The six functions this
# fires on are long because what they do is long — building a wasmtime store,
# assembling a linker — and cutting them into pieces named `part_two` to
# satisfy a counter makes them harder to read, not easier.
too_many_lines = "allow"
# Fires on `allow`/`allow_nets` and similar pairs, which are exactly as
# similar as the things they hold.
similar_names = "allow"
# `act_mcp::*` is the whole translation layer, re-exported deliberately so
# this file reads as "the MCP spelling of everything". Expanding it is how
# `--fix` broke the build here: it listed the names the non-test code used
# and dropped the ones only the test module needed.
wildcard_imports = "allow"

[workspace.dependencies]
act-types = "0.14"
wasmparser = "0.252.0"
# The host's own outbound HTTP. `default-features = false` drops `idn` and
# `public-suffix`: every URL here comes from a metadata document this host
# already validated, or from a registry reference.
hclient = { version = "0.1.0-alpha.11", default-features = false, features = ["json", "gzip", "brotli", "zstd", "http2"] }
hclient-native = { version = "0.1.0-alpha.11", features = ["http2"] }
# A native transport is assembled from three seams `hclient` deliberately does
# not pick for you. This is the host's pick: tokio, rustls over the webpki
# roots, the system resolver.
hclient-rt-tokio = "0.1.0-alpha.10"
hclient-tls-rustls = { version = "0.1.0-alpha.11", features = ["webpki-roots"] }
hclient-dns = "0.1.0-alpha.10"
hclient-dns-system = "0.1.0-alpha.11"
# Shared across two or more workspace members.
anyhow = "1.0.102"
base64 = "0.22.1"
# CSPRNG for the OAuth flow's PKCE verifier, `state`, and one-time callback
# path. `getrandom` rather than `rand`: these want OS entropy directly, not a
# seeded PRNG, and 0.3 is already in the tree.
getrandom = "0.3"
webbrowser = { version = "1.2", features = ["hardened"] }
ciborium = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6"
globset = "0.4"
http = "1"
oci-client = "0.17"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = "1.52"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
# Dev-only, shared.
tempfile = "3"

[profile.release]
lto = "thin"
# Measured on 0.13.0: `act` 69.27 MB -> 48.63 MB, `act-build` 18.70 MB ->
# 14.28 MB. Nearly 30% of the binary was the symbol table — 20.63 MB, of
# which 17.62 MB is `.strtab` alone, bloated by mangled wasmtime and
# cranelift generic instantiations.
#
# `symbols`, not `debuginfo`: the release profile emits no DWARF in the
# first place, so `debuginfo` measured as exactly zero saved. The weight
# was never debug info.
#
# **What this costs, stated plainly:** a panic backtrace from a release
# binary now prints `<unknown>` for every frame. The error message itself
# is unaffected — `Error: component not found: …` still reads the same —
# and the audit trail, which is what an operator actually diagnoses from,
# does not go through backtraces at all. CI keeps no unstripped copy, so a
# frame-level backtrace means rebuilding at the release tag with
# `--config profile.release.strip=false` — which is reproducible, since the
# tag pins both the source and the lockfile.
strip = "symbols"
