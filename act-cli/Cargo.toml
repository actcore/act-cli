[package]
name = "act-cli"
version.workspace = true
edition.workspace = true
description = "CLI host for ACT (Agent Component Tools) WebAssembly components"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["act", "wasm", "component-model", "mcp", "agent"]
categories = ["command-line-utilities", "wasm"]

readme.workspace = true
include = ["src/**", "wit/**", "build.rs"]

[build-dependencies]
embed-manifest = "1.5"

[[bin]]
name = "act"
path = "src/main.rs"

[dependencies]
act-types.workspace = true
ciborium.workspace = true
anyhow.workspace = true
axum = "0.8.9"
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with = "3"
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1.18"
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
# Library only — the crate's default `cli` feature pulls in a full TUI stack
# (ratatui, crossterm, syntect, arboard, tiktoken-rs) we don't need.
toon-format = { version = "0.5", default-features = false }
dirs.workspace = true
futures-util = "0.3"
indicatif = "0.18.4"
regex.workspace = true
reqwest.workspace = true
oci-client.workspace = true
sha2.workspace = true
tar.workspace = true
url.workspace = true
shellexpand = "3"
wasmparser.workspace = true
wasmtime = { version = "45", features = ["component-model", "component-model-async"] }
wasmtime-wasi = { version = "45", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-http = { version = "45", default-features = false, features = ["p2", "p3"] }
http.workspace = true
http-body-util = "0.1"
hyper = "1"
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server", "elicitation", "schemars"] }
schemars = "1.0"
bytes = "1"
cidr = "0.3"
globset.workspace = true
path-clean = "1"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
act-store = { version = "0.9.0", path = "../crates/act-store" }
act-policy = { version = "0.9.0", path = "../crates/act-policy" }
async-trait = "0.1"
bytesize = "2.3.1"

[dev-dependencies]
tempfile.workspace = true
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }
