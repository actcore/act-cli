[package]
name = "act-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI host for ACT (Agent Component Tools) WebAssembly components"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["act", "wasm", "component-model", "mcp", "agent"]
categories = ["command-line-utilities", "wasm"]

readme.workspace = true
include = ["src/**", "build.rs"]

[build-dependencies]
embed-manifest = "1.5"

[[bin]]
name = "act"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
act-types.workspace = true
ciborium.workspace = true
anyhow.workspace = true
axum = "0.8.9"
base64.workspace = true
getrandom.workspace = true
webbrowser.workspace = true
clap.workspace = true
# `act completions` / `act man`. Both read the same clap definition the binary
# parses with, so neither can describe a flag that does not exist.
clap_complete = "4.6"
clap_mangen = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_with = "3"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
# Library only — the crate's default `cli` feature pulls in a full TUI stack
# (ratatui, crossterm, syntect, arboard, tiktoken-rs) we don't need.
toon-format = { version = "0.5", default-features = false }
dirs.workspace = true
hclient.workspace = true
hclient-native.workspace = true
hclient-rt-tokio.workspace = true
hclient-tls-rustls.workspace = true
hclient-dns-system.workspace = true
sha2.workspace = true
tar.workspace = true
url.workspace = true
wasmparser.workspace = true
http.workspace = true
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server", "elicitation", "schemars"] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
act-store = { version = "0.14.0", path = "../crates/act-store" }
act-mcp = { version = "0.14.0", path = "../crates/act-mcp" }
act-policy = { version = "0.14.0", path = "../crates/act-policy" }
act-runtime = { version = "0.14.0", path = "../crates/act-runtime" }
act-credentials = { version = "0.14.0", path = "../crates/act-credentials" }
async-trait = "0.1"
bytesize = "2.3.1"

# Terminal echo control for the credential prompt (`tty.rs`). Named per
# platform because the two APIs share nothing: `termios` on unix, the console
# mode on Windows. Both are already in this build graph via other crates, so
# neither widens it.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true
# Golden output for the `act info` renderers (`format::tests::golden`).
insta = "1.48"
# The integration tests drive the real binary. `assert_cmd` locates it and
# reports a failed run with both streams attached; `predicates` is what its
# `stdout(...)`/`stderr(...)` assertions take.
assert_cmd = "2.2"
predicates = "3.1"
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
