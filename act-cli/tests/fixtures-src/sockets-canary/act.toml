[std]
name = "sockets-canary"
version = "0.1.0"
description = "Canary component for wasi:sockets host integration tests. Its single tool opens a raw TCP connection to a given host/port, so the host's sockets capability gate always fires."
default-language = "en"

[std.capabilities."wasi:sockets"]

[[std.capabilities."wasi:sockets".allow]]
host = "*"
protocols = ["tcp"]
