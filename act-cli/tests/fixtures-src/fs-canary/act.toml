[std]
name = "fs-canary"
version = "0.1.0"
description = "Canary component for wasi:filesystem host integration tests. Its single tool reads a path given in its arguments, so the host's fs capability gate always fires."
default-language = "en"

[std.capabilities."wasi:filesystem"]

[[std.capabilities."wasi:filesystem".allow]]
path = "**"
mode = "rw"
